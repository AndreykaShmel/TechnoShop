<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TechnoShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
          <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalog:product_list' %}">TechnoShop</a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <!-- Кнопка корзины -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'catalog:cart_detail' %}">
                            Корзина
                            {% if cart|length > 0 %}
                                <span class="badge bg-danger">{{ cart|length }}</span>
                            {% endif %}
                        </a>
                    </li>

                    <!-- Проверяем, авторизован ли пользователь -->
                    {% if user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'catalog:my_orders' %}">Мои заказы</a></li>
                        <li class="nav-item"><span class="nav-link text-warning">Привет, {{ user.username }}!</span></li>
                        <li class="nav-item">
                            <form action="{% url 'logout' %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-link nav-link" style="display:inline; border:none; padding:0;">Выйти</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Войти</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'catalog:register' %}">Регистрация</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
