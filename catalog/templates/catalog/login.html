{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <h2>Вход в аккаунт</h2>
        <form method="post" class="mt-3">
            {% csrf_token %}

            <!-- Выводим ошибки, если логин или пароль неверные -->
            {% if form.errors %}
                <div class="alert alert-danger">Неверное имя пользователя или пароль.</div>
            {% endif %}

            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}:</label>
                    <!-- Класс form-control делает поля красивыми -->
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" class="form-control" required>
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>

        <p class="mt-3">Нет аккаунта? <a href="{% url 'catalog:register' %}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
